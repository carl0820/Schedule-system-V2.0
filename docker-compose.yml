version: '3.8'

services:
  robot-scheduler:
    build: .
    container_name: robot-scheduler
    ports:
      - "8000:8000"
    # Windows上使用bridge网络（默认），Linux可以使用host网络
    # network_mode: host  # 仅在Linux上可用
    environment:
      - PYTHONUNBUFFERED=1
      # 如果需要代理，取消下面的注释并设置代理地址
      # - HTTP_PROXY=http://proxy:port
      # - HTTPS_PROXY=http://proxy:port
      # - NO_PROXY=localhost,127.0.0.1,10.160.0.0/16
    volumes:
      # 挂载日志目录
      - ./logs:/app/logs
      # 挂载数据目录（如果需要持久化）
      - ./data:/app/data
    restart: unless-stopped
    # 如果需要访问宿主机的VPN网络，可能需要额外配置
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"  # 访问宿主机

